<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp group list</title>

  <meta property="og:title" content="WhatsApp groups">
  <meta property="og:description" content="Matan arewa group list">
  <meta property="og:type" content="website">
  <meta property="og:url"
        content="https://only-fan.github.io/Linda-galary/">
  <meta property="og:image"
        content="https://only-fan.github.io/Linda-galary/b4279233b554748abe60675daa6ac9ec.jpg">

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 20px;
      background: #f0f0f0;
      color: #222;
    }

    a.button {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 22px;
      background: #087f5b;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
    }

    #status {
      margin-top: 18px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h2>Continue to website</h2>
  <p>Tap the button below to continue.</p>

  <a class="button"
     id="continueLink"
     href="https://asiafilm.org/4/52b5dc35d17cbe47a4bc7c296c0f5010">
    Continue
  </a>

  <p id="status">If the page does not open, tap Continue.</p>

  <script>
    const targetUrl =
      "https://asiafilm.org/4/52b5dc35d17cbe47a4bc7c296c0f5010";

    const ua = navigator.userAgent || "";
    const isTikTok = /TikTok|BytedanceWebview/i.test(ua);
    const isAndroid = /Android/i.test(ua);

    const link = document.getElementById("continueLink");
    const status = document.getElementById("status");

    if (isTikTok && isAndroid) {
      const intentUrl =
        "intent://" +
        targetUrl.replace(/^https?:\/\//, "") +
        "#Intent;scheme=https;action=android.intent.action.VIEW;" +
        "package=com.android.chrome;" +
        "S.browser_fallback_url=" +
        encodeURIComponent(targetUrl) +
        ";end";

      link.href = intentUrl;
      link.textContent = "Open in Chrome";
      status.textContent =
        "Tap the button to try opening Chrome.";
    } else {
      link.href = targetUrl;
    }
  </script>
</body>
</html>
